name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install constrained test dependencies
        run: >-
          python -m pip install
          -c constraints/python-${{ matrix.python-version }}.txt
          ".[dev]"
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p no:capture -q --ignore=tests/integration

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and distribution test dependencies
        run: >-
          python -m pip install
          -c constraints/python-3.11.txt
          build pytest
      - name: Build wheel and source distribution
        run: python -m build --outdir "${RUNNER_TEMP}/candidate"
      - name: Test distribution contents and clean installation
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          REVISE_DIST_DIR: ${{ runner.temp }}/candidate
          REVISE_CLEAN_INSTALL: "1"
        run: >-
          python -m pytest -p no:capture -q
          tests/integration/distribution/test_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-dist
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error

  installed-cli:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-dist
          path: ${{ runner.temp }}/candidate
      - name: Install exact candidate wheel
        run: >-
          python -m pip install
          -c constraints/python-${{ matrix.python-version }}.txt
          pytest
          "${RUNNER_TEMP}/candidate/revise_svc-0.1.0rc1-py3-none-any.whl"
      - name: Test installed reconstruction CLI
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          REVISE_WHEEL: ${{ runner.temp }}/candidate/revise_svc-0.1.0rc1-py3-none-any.whl
        run: >-
          python -m pytest -p no:capture -q
          tests/integration/application/test_installed_cli.py

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs "${RUNNER_TEMP}/docs-html"

  tacco-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TACCO smoke environment
        run: >-
          python -m pip install
          -c constraints/python-3.11.txt
          pytest numpy pandas scipy anndata PyYAML
          POT==0.9.5 tacco==0.5.0
      - name: Run TACCO solver smoke
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p no:capture -q
          tests/integration/solvers/test_tacco_solver_smoke.py
