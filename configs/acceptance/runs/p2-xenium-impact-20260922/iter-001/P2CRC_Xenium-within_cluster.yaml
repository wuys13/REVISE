# Full P2CRC Xenium reconstruction for within_cluster OT assembly.
# Inherits scientific parameters from P2CRC_Xenium-random.yaml with within_cluster mapping.
schema_version: 1
application:
  svc_type: sc-SVC
  mode: cluster
paths:
  root_dir: .
algorithm:
  ot_method: tacco
inputs:
  st:
    path: raw_data/zenodo/Real_application/P2CRC_Xenium.h5ad
    format: h5ad
    expression:
      identity: raw_counts
      scale: untransformed_nonnegative
  reference:
    path: raw_data/zenodo/Real_application/adata_sc_all_reanno.h5ad
    format: h5ad
    filter_column: Patient
    filter_value: P2CRC
    expression:
      identity: raw_counts
      scale: untransformed_nonnegative
preprocessing:
  spatial:
    min_transcript_counts: 60
    min_cell_counts: 100
  reference:
    min_transcript_counts: null
    min_cell_counts: 100
global_anchoring:
  broad_column: Level1
local_refinement:
  subtype_column: Level2
  alpha: 0.2
  resolutions:
  - 0.6
  - 0.7
  - 0.8
output:
  dir: results/p2-xenium-impact-20260922/iter-001/P2CRC_Xenium/within_cluster
  ist_mapping: within_cluster
execution:
  seed: 42
delivery:
  sample_id: P2CRC_Xenium
  coordinates:
    key: spatial
    unit: pixel
    microns_per_coordinate: 0.2125
