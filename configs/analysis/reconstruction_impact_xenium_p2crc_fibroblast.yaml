schema_version: 1
sample:
  id: P2CRC_Xenium_ThreeParents
route_kind: sc_svc
context:
  h5ad: raw_data/Real_application/P2CRC_Xenium.h5ad
  level1_column: Level1
  spatial_key: spatial
raw_level2_mapping:
  reference_h5ad: raw_data/Real_application/adata_sc_all_reanno.h5ad
  method: tacco
  level1_column: Level1
  level2_column: Level2
  reference_filter:
    column: Patient
    value: P2CRC
  tacco:
    multi_center: 1
    lamb: 0.001
partition_change:
  mode: fixed_within_level1
  level1_resolution_candidates: [0.3, 0.5, 0.8]
  within_level1_resolution: 0.5
  random_state: 42
  n_top_genes: 2000
  comparisons:
    - name: Fibroblast
      level1_value: Fibroblast
      raw_h5ad: raw_data/Real_application/P2CRC_Xenium.h5ad
      reconstructed_spatial_h5ad: results/sc_SVC_case/P2CRC_Xenium/Fibroblast/spatial.h5ad
      reconstructed_cluster_key: SVC_cluster
      level1_column: Level1
      spatial_key: spatial
      expression_h5ad: results/sc_SVC_case/P2CRC_Xenium/Fibroblast/expr.h5ad
    - name: Mono_Macro
      level1_value: Mono_Macro
      raw_h5ad: raw_data/Real_application/P2CRC_Xenium.h5ad
      reconstructed_spatial_h5ad: results/sc_SVC_case/P2CRC_Xenium/Mono_Macro/spatial.h5ad
      reconstructed_cluster_key: SVC_cluster
      level1_column: Level1
      spatial_key: spatial
      expression_h5ad: results/sc_SVC_case/P2CRC_Xenium/Mono_Macro/expr.h5ad
    - name: T
      level1_value: T
      raw_h5ad: raw_data/Real_application/P2CRC_Xenium.h5ad
      reconstructed_spatial_h5ad: results/sc_SVC_case/P2CRC_Xenium/T/spatial.h5ad
      reconstructed_cluster_key: SVC_cluster
      level1_column: Level1
      spatial_key: spatial
      expression_h5ad: results/sc_SVC_case/P2CRC_Xenium/T/expr.h5ad
spatial_region:
  coordinate_unit: pixel
  microns_per_coordinate: 0.2125
  candidate_window_sides_um: [16.0, 24.0, 32.0, 40.0, 56.0, 80.0]
  min_parent_units: 4
  rarefaction_draws: 200
  threshold_bootstraps: 500
  anatomy_region:
    tumor_label: Tumor
    normal_source_label: Intestinal Epithelial
output:
  dir: output/reconstruction_impact/P2CRC_Xenium_ThreeParents
  final_notebook: notebook/Xenium_sc_SVC_Fibroblast_Reconstruction_Impact.ipynb
