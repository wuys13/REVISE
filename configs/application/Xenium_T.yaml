schema_version: 1

application:
  svc_type: sc-SVC

paths:
  root_dir: . # EDIT: this is the command launch directory, not the YAML directory.

algorithm:
  ot_method: tacco # KEEP: this Xenium protocol uses TACCO for GA and LR.

inputs:
  st:
    path: raw_data/Real_application/P1CRC_Xenium.h5ad # EDIT
    format: h5ad
  reference:
    path: raw_data/Real_application/adata_sc_all_reanno.h5ad # EDIT
    format: h5ad

global_anchoring:
  broad_column: Level1 # EDIT to a column in reference.obs.

local_refinement:
  subtype_column: Level2 # EDIT to a refined column in reference.obs.
  select_cell_type: T # KEEP only when this broad label exists in reference.obs.

output:
  dir: output # EDIT: relative to paths.root_dir.
  name: P1CRC_Xenium_T_sc-SVC # EDIT: one logical result name; do not add .h5ad.

execution:
  seed: 42 # KEEP for reproducible runs.
