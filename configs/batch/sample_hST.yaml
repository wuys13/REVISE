# Copy to the sample directory as sample.yaml; edit paths and protocol values.
schema_version: 1
sample:
  id: sample_001
  modality: hST
inputs:
  st:
    path: source/spatial.h5ad
    format: h5ad
  reference:
    path: /absolute/path/to/reference.h5ad
    format: h5ad
preparation:
  spatial:
    matrix: X
    spatial_key: spatial
    coordinate_unit: pixel
    # microns_per_coordinate: 0.273808 # Only if verified for this source.
  reference:
    matrix: X
algorithm:
  ot_method: pot
preprocessing:
  spatial:
    min_transcript_counts: null
    min_counts: 20
    min_cell_counts: 30
  reference:
    min_transcript_counts: null
    min_genes: 20
    min_cell_counts: 50
global_anchoring:
  broad_column: Level1
local_refinement:
  strength: 0.2
output: {}
execution:
  seed: 42
