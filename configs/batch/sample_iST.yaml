# Copy this file to <input_root>/<optional classification>/<sample>/sample.yaml.
schema_version: 1
sample:
  id: sample_001 # EDIT: unique within the batch.
  modality: iST
inputs:
  st:
    path: source/spatial.h5ad # EDIT: relative to sample.yaml, or absolute.
    format: h5ad
  reference:
    path: /absolute/path/to/reference.h5ad # EDIT: may be shared across samples.
    format: h5ad
    # filter_column: Patient
    # filter_value: P2CRC
preparation:
  spatial:
    matrix: X # EDIT explicitly: X or layers/<name>. No normalization is inferred.
    spatial_key: spatial
    coordinate_unit: pixel # EDIT to the source's actual coordinate unit (um or pixel).
    # microns_per_coordinate: 0.2125 # Set only from this source's calibration.
  reference:
    matrix: X
    # Enable only when the source label has the intended meaning:
    # label_mapping:
    #   Level1:
    #     Mono_Macro: Macro
algorithm:
  ot_method: tacco
preprocessing:
  # These are example protocol values, not universal batch QC thresholds.
  spatial:
    min_transcript_counts: 60
    min_cell_counts: 100
  reference:
    min_transcript_counts: null
    min_cell_counts: 100
global_anchoring:
  broad_column: Level1
local_refinement:
  subtype_column: Level2
  cell_types: [T, Macro, Fibroblast]
  alpha: 0.2
  resolutions: [0.6, 0.7, 0.8]
output:
  ist_mapping: paired # paired | mean | random
execution:
  seed: 42
