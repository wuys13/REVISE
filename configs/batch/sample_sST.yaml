# Copy to the sample directory as sample.yaml; edit paths and protocol values.
schema_version: 1
sample:
  id: sample_001
  modality: sST
inputs:
  st:
    path: source/spatial.h5ad
    format: h5ad
  reference:
    path: /absolute/path/to/reference.h5ad
    format: h5ad
  # pm_on_cell:
  #   path: source/PM_on_cell.csv
preparation:
  spatial:
    matrix: X
    spatial_key: spatial
    coordinate_unit: pixel
    # microns_per_coordinate: 1.0 # Set from this source, not from another platform.
  reference:
    matrix: X
algorithm:
  ot_method: pot
preprocessing:
  spatial:
    min_transcript_counts: null
    min_counts: 20
    min_cell_counts: 20
  reference:
    min_transcript_counts: null
    min_genes: 20
    min_cell_counts: 20
global_anchoring:
  broad_column: Level1
local_refinement:
  strength: 0.0
  graph:
    method: pca
    alpha: 0.2
    n_neighbors: 10
    exp_neighbors: 10
    spatial_neighbors: 10
  match_spot_sum: true
output: {}
execution:
  seed: 42
