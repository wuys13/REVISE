<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">REVISE current reconstruction architecture</title>
  <desc id="desc">The public CLI and Python API feed REVISEPipeline, unified configuration and routing, a pipeline context, the fixed reconstruction lifecycle, backend strategies, and one platform SVC output.</desc>
  <style>
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .primary { fill: #e0f2fe; stroke: #0369a1; }
    .strategy { fill: #fef3c7; stroke: #a16207; }
    .text { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #0f172a; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
    .arrow { stroke: #475569; stroke-width: 2; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#ffffff" />

  <rect x="30" y="40" width="230" height="82" rx="10" class="box primary" />
  <text x="145" y="72" text-anchor="middle" class="text">CLI / Python API</text>
  <text x="145" y="98" text-anchor="middle" class="small">revise-reconstruct · REVISEPipeline</text>

  <rect x="330" y="40" width="230" height="82" rx="10" class="box primary" />
  <text x="445" y="72" text-anchor="middle" class="text">REVISEPipeline</text>
  <text x="445" y="98" text-anchor="middle" class="small">configuration · preflight · provenance</text>

  <rect x="630" y="40" width="230" height="82" rx="10" class="box" />
  <text x="745" y="72" text-anchor="middle" class="text">Config &amp; Routing</text>
  <text x="745" y="98" text-anchor="middle" class="small">profiles · route strategies · OT solvers</text>

  <rect x="930" y="40" width="230" height="82" rx="10" class="box" />
  <text x="1045" y="72" text-anchor="middle" class="text">Pipeline Context</text>
  <text x="1045" y="98" text-anchor="middle" class="small">inputs · state · run evidence</text>

  <path d="M260 81 H330" class="arrow" />
  <path d="M560 81 H630" class="arrow" />
  <path d="M860 81 H930" class="arrow" />
  <path d="M1045 122 V185 H335 V230" class="arrow" />

  <rect x="30" y="230" width="610" height="145" rx="10" class="box" />
  <text x="335" y="265" text-anchor="middle" class="text">Unified Reconstruction Lifecycle</text>
  <text x="335" y="300" text-anchor="middle" class="small">validate → Global Anchoring (GA) → prepare local units → graph</text>
  <text x="335" y="328" text-anchor="middle" class="small">build OT problem → Local Refinement (LR) → update → finalize</text>
  <text x="335" y="354" text-anchor="middle" class="small">one fixed stage order for sp-SVC, sc-SVC, and sc-SVC-sr</text>

  <rect x="700" y="230" width="220" height="145" rx="10" class="box strategy" />
  <text x="810" y="270" text-anchor="middle" class="text">Backend Strategies</text>
  <text x="810" y="305" text-anchor="middle" class="small">adapters · runners · kernels</text>
  <text x="810" y="333" text-anchor="middle" class="small">GA / LR: POT or TACCO</text>

  <rect x="980" y="230" width="190" height="145" rx="10" class="box primary" />
  <text x="1075" y="270" text-anchor="middle" class="text">SVC Output</text>
  <text x="1075" y="305" text-anchor="middle" class="small">sp-SVC · sc-SVC · sc-SVC-sr</text>
  <text x="1075" y="333" text-anchor="middle" class="small">H5AD result(s) + manifest</text>

  <path d="M640 302 H700" class="arrow" />
  <path d="M920 302 H980" class="arrow" />
</svg>
