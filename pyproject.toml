[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "revise-svc"
dynamic = ["version"]
description = "Vision-integrated spatial transcriptomics SVC reconstruction and Sim2Real-ST benchmarking."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
keywords = [
  "spatial transcriptomics",
  "single-cell",
  "optimal transport",
  "benchmark",
  "bioinformatics",
  "SVC"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "anndata>=0.9",
  "matplotlib>=3.6",
  "numba>=0.57",
  "numpy>=1.22",
  "pandas>=1.5",
  "POT==0.9.5",
  "PyYAML>=6.0",
  "scanpy>=1.9",
  "statsmodels>=0.14.1",
  "scikit-image>=0.20",
  "scikit-learn>=1.2",
  "scipy>=1.9",
  "seaborn>=0.12",
  "squidpy>=1.2",
  "tqdm>=4.64",
  "igraph",
  "leidenalg",
  "scikit-misc"
]

[project.scripts]
revise-reconstruct = "reconstruct:main"
revise-build-histology-priors = "revise.preprocess.cli:main"
revise-compute-biological-metrics = "revise.analysis.cli:main"

[project.optional-dependencies]
tacco = ["tacco==0.5.0"]
pathway = [
  "gseapy",
  "networkx",
  "omicverse==1.7.5"
]
cci = [
  "cellphonedb",
  "omicverse==1.7.5"
]
trajectory = ["omicverse==1.7.5"]
spatialdata = [
  "spatialdata>=0.2"
]
dev = [
  "black",
  "ruff",
  "pytest",
  "pytest-cov",
  "tomli; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/wuys13/REVISE"
Documentation = "https://revise-svc.readthedocs.io/en/latest/"
Repository = "https://github.com/wuys13/REVISE"
Issues = "https://github.com/wuys13/REVISE/issues"

[tool.setuptools]
py-modules = ["reconstruct"]
packages = { find = { include = ["revise*"] } }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "revise._version.__version__" }

[tool.setuptools.package-data]
revise = ["revise.yaml", "application/templates/*.yaml"]
