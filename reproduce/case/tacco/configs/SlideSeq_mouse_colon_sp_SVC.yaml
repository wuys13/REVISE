schema_version: 1

application:
  svc_type: sp-SVC

paths:
  root_dir: .

algorithm:
  ot_method: tacco

inputs:
  st:
    path: prepared/slideseq_mouse_colon/normal_Puck_200701_21.h5ad
    format: h5ad
  reference:
    path: prepared/slideseq_mouse_colon/normal_scRNAseq.h5ad
    format: h5ad

preprocessing:
  spatial:
    min_transcript_counts: null
    min_counts: 50
    min_cell_counts: 1
  reference:
    min_transcript_counts: null
    min_genes: null
    min_cell_counts: 1

global_anchoring:
  broad_column: Level1

local_refinement:
  strength: 0.0
  graph:
    method: joint
    alpha: 0.8
    n_neighbors: 10
    exp_neighbors: 10
    spatial_neighbors: 6

output:
  dir: results/slideseq_mouse_colon
  name: SlideSeq_mouse_colon_sp_SVC

execution:
  seed: 42
