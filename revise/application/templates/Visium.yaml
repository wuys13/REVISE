schema_version: 1

application:
  svc_type: sc-SVC
  mode: sr

paths:
  root_dir: . # EDIT: this is the command launch directory, not the YAML directory.

algorithm:
  ot_method: pot # KEEP: this Visium protocol uses POT for GA and LR.

inputs:
  st:
    path: raw_data/visium_mouse_brain/ST_mouse_brain_prepared.h5ad # EDIT
    format: h5ad
  reference:
    path: raw_data/visium_mouse_brain/scRNA_mouse_brain_prepared.h5ad # EDIT
    format: h5ad
  # Providing this exact prior selects PM-guided virtual-cell assignment.
  pm_on_cell:
    path: raw_data/visium_mouse_brain/PM_on_cell.csv

preprocessing:
  spatial:
    min_transcript_counts: null
    min_counts: 20
    min_cell_counts: 20
  reference:
    min_transcript_counts: null
    min_genes: 20
    min_cell_counts: 20

global_anchoring:
  broad_column: Level1 # EDIT to a column in reference.obs.

local_refinement:
  # A strength of 0.0 does not skip local refinement; it disables only blending.
  strength: 0.0 # KEEP; LR still runs, but posterior blending is disabled.
  graph:
    method: pca
    alpha: 0.2
    n_neighbors: 10
    exp_neighbors: 10
    spatial_neighbors: 10
  match_spot_sum: true

output:
  dir: results/visium_mouse_brain_revise # EDIT: relative to paths.root_dir.
  name: REVISEVisiumMouseBrain_sc-SVC # EDIT: one logical result name; do not add .h5ad.

execution:
  seed: 42 # KEEP for reproducible runs.
