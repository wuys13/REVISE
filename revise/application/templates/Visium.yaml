schema_version: 1

application:
  svc_type: sc-SVC-sr
  sample_name: REVISEVisiumMouseBrain # EDIT: match the reference patient value when present.

paths:
  root_dir: . # EDIT: this is the command launch directory, not the YAML directory.

algorithm:
  ot_method: pot # KEEP unless you intentionally select another installed solver.

inputs:
  mode: direct
  st:
    path: raw_data/visium_mouse_brain/ST_mouse_brain_prepared.h5ad # EDIT
    format: h5ad
  reference:
    path: raw_data/visium_mouse_brain/scRNA_mouse_brain_prepared.h5ad # EDIT
    format: h5ad
    patient_key: Patient # EDIT if the reference uses another obs column.

global_anchoring:
  broad_column: Level1 # EDIT to a column in reference.obs.

local_refinement:
  # A strength of 0.0 does not skip local refinement; it disables only blending.
  strength: 0.0 # KEEP; LR still runs, but posterior blending is disabled.

output:
  path: output # EDIT if needed.

execution:
  action: run
  seed: 42 # KEEP for reproducible runs.
