schema_version: 1

application:
  svc_type: sp-SVC
  sample_name: P1CRC # EDIT: match the reference patient value when present.

paths:
  root_dir: . # EDIT: this is the command launch directory, not the YAML directory.

algorithm:
  ot_method: pot # KEEP unless you intentionally select another installed solver.

inputs:
  mode: direct
  st:
    path: raw_data/Real_application/P1CRC_HD.h5ad # EDIT
    format: h5ad
  reference:
    path: raw_data/Real_application/adata_sc_all_reanno.h5ad # EDIT
    format: h5ad
    patient_key: Patient # EDIT if the reference uses another obs column.

global_anchoring:
  broad_column: Level1 # EDIT to a column in reference.obs.

local_refinement:
  strength: 0.2 # KEEP; this changes LR cost blending and does not skip LR.

output:
  path: output # EDIT if needed.

execution:
  action: run
  seed: 42 # KEEP for reproducible runs.
