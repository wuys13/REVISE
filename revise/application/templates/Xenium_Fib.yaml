schema_version: 1

application:
  svc_type: sc-SVC

paths:
  root_dir: . # EDIT: this is the command launch directory, not the YAML directory.

algorithm:
  ot_method: tacco # KEEP: this Xenium protocol uses TACCO for GA and LR.

inputs:
  st:
    path: raw_data/Real_application/P2CRC_Xenium.h5ad # EDIT
    format: h5ad
  reference:
    path: raw_data/Real_application/adata_sc_all_reanno.h5ad # EDIT
    format: h5ad
    filter_column: Patient
    filter_value: P2CRC

preprocessing:
  spatial:
    min_transcript_counts: 60
    min_cell_counts: 100
  reference:
    min_transcript_counts: null
    min_cell_counts: 100

global_anchoring:
  broad_column: Level1 # EDIT to a column in reference.obs.

local_refinement:
  subtype_column: Level2 # EDIT to a refined column in reference.obs.
  select_cell_type: Fibroblast # KEEP only when this broad label exists in reference.obs.
  alpha: 0.2
  resolutions: [0.6, 0.7, 0.8]

output:
  dir: output/P2CRC_Xenium/Fib # EDIT: relative to paths.root_dir.

execution:
  seed: 42 # KEEP for reproducible runs.
